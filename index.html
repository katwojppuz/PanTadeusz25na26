<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .active {
            background-color: #dc3545 !important;
            border-color: #dc3545 !important;
            color: white !important;
        }
    </style>
    <title>Pan Tadeusz</title>
</head>
<body>
    <header class="bg-danger text-white text-center py-4 mb-4">
        <h1>Pan Tadeusz, czyli ostatni zajazd na Litwie: <br>historia szlachecka z roku 1811 i 1812 we dwunastu ksiegach wierszem</h1>
        <p>Adam Mickiewicz</p>
    </header>
    <section class="container pb-5">
        <div class="row">
            <div class="col-4">
                <div class="list-group" id="toc">
                    <a href="./index.html" class="list-group-item list-group-item-action">Strona główna</a>
                </div>
            </div>
            <div class="col-8" id="content"></div>
        </div>
    </section>
    <footer class="bg-danger-subtle text-center py-3 mt-4 fixed-bottom">
        <p>Katarzyna Wójcik, Akademia Nauk Stosowanych w Nowym Targu</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="text/javascript">
        for (let i = 1; i <= 12; i++) {
            let a = document.createElement('a');
            a.href = "./index.html?k="+i;
            a.className = "list-group-item list-group-item-action";
            a.innerHTML = "Księga "+i
            document.getElementById('toc').appendChild(a);
        }
        const current = window.location.href;
        document.querySelectorAll("#toc > a").forEach(function(elem){ 
            if(elem.href === current){
                elem.classList.add("active");
            }
        });
        const url = new URL(current);
        const i = url.searchParams.get("k");
        console.log(i);
        if(i){
            fetch("./k"+i+".html")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("content").innerHTML = data;
                });
        } else {
            let img = document.createElement('img');
            img.src = "./pan-tadeusz.jpeg";
            img.alt = "Pan Tadeusz";
            img.className = "img-fluid mb-4";
            document.getElementById("content").appendChild(img);
        }
        function hide_show() {
            var div = document.getElementById("book_content");
            if (div.style.display === "none") {
                div.style.display = "block";
                document.querySelector(".btn").innerHTML = "Zwiń";
            } else {
                div.style.display = "none";
                document.querySelector(".btn").innerHTML = "Rozwiń";
            }
        }
    </script>
</body>
</html>
